name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint contact endpoint
        run: php -l dist/api/contact.php
      - name: Fail if the build contains unexpected server-side files
        run: |
          extra=$(find dist -type f \( -name '*.php' -o -name '*.phtml' -o -name '*.phar' \) ! -path 'dist/api/contact.php')
          if [ -n "$extra" ]; then echo "Unexpected executable files:"; echo "$extra"; exit 1; fi
